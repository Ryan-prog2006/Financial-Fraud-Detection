name: FinShield CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create required test directories and files
        run: |
          mkdir -p backend/data/raw backend/data/processed backend/data/models backend/data/policy_docs 
          mkdir -p backend/data/vectorstore backend/data/drift_reports backend/notebooks/figures
          mkdir -p backend/mlruns

      - name: Generate test fixtures
        working-directory: backend
        run: |
          python generate_fixtures.py
          python -m src.data.pipeline
          python -m src.models.pipeline_ml
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run full test suite
        working-directory: backend
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/notebooks/figures/
            backend/data/drift_reports/
