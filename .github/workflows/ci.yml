name: FinShield CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required test directories and files
        run: |
          mkdir -p data/raw data/processed data/models data/policy_docs 
          mkdir -p data/vectorstore data/drift_reports notebooks/figures
          mkdir -p mlruns

      - name: Generate test fixtures
        run: |
          python -c "
          import pandas as pd, numpy as np
          n = 1000
          data = {f'V{i}': np.random.randn(n) for i in range(1,29)}
          data['Time'] = np.arange(n) * 10.0
          data['Amount'] = np.random.uniform(1, 500, n)
          data['Class'] = np.where(np.random.rand(n) < 0.002, 1, 0)
          pd.DataFrame(data).to_csv('data/raw/creditcard.csv', index=False)
          "
          python src/data/pipeline.py
          python src/models/pipeline_ml.py
          python src/llm/document_loader.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run full test suite
        run: pytest tests/ -v --tb=short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            notebooks/figures/
            data/drift_reports/
